experiment_name: mfxlstm_example
head: regression
model: x_lstm
xlstm_num_blocks: 2
xlstm_slstm_at:
- 0
xlstm_heads: 2
xlstm_kernel_size: 4
xlstm_proj_factor: 1.0
device: cuda:0
dataset: generic
data_dir: /home/usr/work
run_dir: /home/usr/work/mfxlstm_runs
seed: 1
use_frequencies:
- 1D
- 1h
predict_last_n:
  1D: 1
  1h: 24
seq_length:
  1D: 365
  1h: 336
train_basin_file: basins/train_basins.txt
train_start_date: 01/01/2011
train_end_date: 31/12/2021
validate_every: null
validate_n_random_basins: 9999
validation_basin_file: basins/train_basins.txt
validation_start_date: 01/01/2011
validation_end_date: 31/12/2021
test_basin_file: basins/test_basins.txt
test_start_date: 01/01/2011
test_end_date: 31/12/2023
dynamic_inputs:
- CaSR_v3.1_A_PR0_SFC
- CaSR_v3.1_A_TT_1.5m
static_attributes:
- mean_elev
- mean_slope
- elev_std
- slope_std
target_variables:
- qobs_mm_per_day
metrics:
- NSE
- KGE
- RMSE
- FHV
- FMS
- FLV
- Peak-Timing
- Missed-Peaks
- Peak-MAPE
loss: NSE
epochs: 30
batch_size: 128
hidden_size: 256
learning_rate:
  0: 0.0005
  10: 0.0001
  20: 5e-05
  30: 1e-05
output_dropout: 0.4
initial_forget_bias: 3
num_workers: 4
optimizer: Adam
output_activation: linear
log_interval: 20
log_n_figures: 0
log_tensorboard: false
save_validation_results: false
allow_subsequent_nan_losses: 99999
clip_gradient_norm: 1
clip_targets_to_zero:
- qobs_mm_per_day
